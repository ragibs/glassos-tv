name: Release

# A version tag (v1.0.3, or v1.0.3-beta for a pre-release) builds the signed release APK and publishes it as a GitHub
# release. GlassOS's update check (Updater.kt) finds it there and offers it in Control Center.
#
# Secrets (Settings > Secrets and variables > Actions): KEYSTORE_BASE64 (the keystore file, base64), KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD, and optionally TMDB_API_KEY. See CONTRIBUTING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "${GITHUB_REF_NAME#v}" != "$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName \"$name\" in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set; see CONTRIBUTING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/keystore.properties"

      - name: Build the release APK
        env:
          GLASS_KEYSTORE_PROPERTIES: ${{ runner.temp }}/keystore.properties
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="GlassOS-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # An unsigned APK cannot update anyone's GlassOS: never publish one.
          cert=$(keytool -printcert -jarfile "$apk" | sed -n 's/.*SHA256: //p' | head -1)
          if [ -z "$cert" ]; then
            echo "::error::The APK is not signed"
            exit 1
          fi
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          printf 'APK SHA-256: `%s`\n\nSigning certificate SHA-256: `%s`\n' "$sum" "$cert" > notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" $pre --title "GlassOS $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keystore.properties"
